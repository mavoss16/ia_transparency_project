# _quarto.yml
project:
  type: website
  output-dir: ../docs
  render:
    - "**/*.qmd"
    # Campaign finance templates must stay project members so they inherit the
    # site theme — excluding the directory made Quarto render them as
    # standalone documents with stock Bootstrap and no custom.scss. Like the
    # legislature templates they are parameterized, so a project-wide render
    # emits a default-parameter copy into docs/templates/; the real per-entity
    # pages come from explicit -P renders.
    #
    # The OJS variant stays excluded: it is experimental and its output is
    # ~13 MB, which is not worth regenerating on every project render.
    - "!campaign_finance/templates/recipient_template_ojs.qmd"

website:
  title: "Iowa Transparency Project"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: legislation/index.qmd
        text: Legislation
      - href: legislators/index.qmd
        text: Legislators
      # Future domains — uncomment as each section gets an index page
      # - href: elections/index.qmd
      #   text: Elections
      # - href: campaign_finance/index.qmd
      #   text: Campaign Finance
      # - href: about.qmd
      #   text: About
  search: true

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    # Index pages read better full-width with no right TOC rail (redesign);
    # the detail templates opt back in with toc: true in their own front matter.
    toc: false
    page-layout: full
