# _quarto.yml
project:
  type: website
  output-dir: ../docs
  render:
    - "**/*.qmd"
    # Campaign finance templates are parameterized and rendered explicitly
    # (with -P params) by the future R/campaign_finance/render.R — not as
    # part of project-wide renders.
    - "!campaign_finance/"

website:
  title: "Iowa Political Transparency"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: legislation/index.qmd
        text: Legislation
      - href: legislators/index.qmd
        text: Legislators
      # Future domains — uncomment as each section gets an index page
      # - href: elections/index.qmd
      #   text: Elections
      # - href: campaign_finance/index.qmd
      #   text: Campaign Finance
      # - href: about.qmd
      #   text: About
  search: true

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    # Index pages read better full-width with no right TOC rail (redesign);
    # the detail templates opt back in with toc: true in their own front matter.
    toc: false
    page-layout: full
