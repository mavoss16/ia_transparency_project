# _quarto.yml
project:
  type: website
  output-dir: ../docs
  render:
    - "**/*.qmd"
    # Campaign finance is excluded from project renders for now (2026-10-12):
    # its templates query campaign_finance.duckdb, which is gitignored and so
    # absent in CI, and nothing under campaign_finance/ is published yet.
    # NOTE: excluding the directory makes Quarto treat those files as standalone
    # documents (stock Bootstrap, no custom.scss). To re-enable themed CF pages,
    # drop this line — and give CI a way to build or skip the database first.
    # The OJS variant should stay excluded either way (~13 MB output).
    - "!campaign_finance/**"
  # GitHub Pages reads the custom domain from docs/CNAME; copying it on every
  # render keeps a full render (which cleans docs/) from dropping the domain.
  resources:
    - CNAME

website:
  title: "Iowa Transparency Project"
  site-url: https://iowatransparencyproject.org
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: legislation/index.qmd
        text: Legislation
      - href: legislators/index.qmd
        text: Legislators
      # Future domains — uncomment as each section gets an index page
      # - href: elections/index.qmd
      #   text: Elections
      # - href: campaign_finance/index.qmd
      #   text: Campaign Finance
      # - href: about.qmd
      #   text: About
  search: true

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    # Index pages read better full-width with no right TOC rail (redesign);
    # the detail templates opt back in with toc: true in their own front matter.
    toc: false
    page-layout: full
