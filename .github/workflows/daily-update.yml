name: Daily Pipeline Update

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC = midnight CT
  workflow_dispatch:
    inputs:
      force_render:
        description: 'Clear the render manifest and re-render every page. Runs are time-budgeted, so later runs (with this OFF) finish the backlog. Ticking it again restarts the full re-render.'
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false  # let a running job finish rather than cancel it

permissions:
  contents: write  # the final step pushes docs/, data/ and the manifest back to main

jobs:
  update-and-render:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-27, where PPM has no binary for
    # the locked `later` 1.4.2 and its source fails to build against the newer glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true  # binary packages from Posit PPM — faster installs

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libglpk-dev \
            libudunits2-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore renv cache
        uses: r-lib/actions/setup-renv@v2

      - name: Run pipeline
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          # Stop starting new bill pages after this long, so the job finishes
          # (legislators, committees, commit) inside timeout-minutes. Bills not
          # reached stay out of render_manifest.csv and the next run renders them.
          # Measured 2026-10-13: setup + pipeline ~10 min, bills ~8/min, and
          # the always-forced legislators + committees ~115 min. 180 finished
          # 5 seconds inside the 300-minute timeout; 150 leaves ~25 min slack.
          RENDER_TIME_BUDGET_MINUTES: 150
        run: |
          if [ "${{ github.event.inputs.force_render }}" = "true" ]; then
            # Full re-render: forget everything rendered so far. The time budget
            # spreads the backlog across this run and the following ones.
            Rscript -e "source('R/legislature/render.R'); clear_manifest()"
          fi
          Rscript R/legislature/run_pipeline.R

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 7

      - name: Commit and push updates
        if: always()  # keep partial render progress even if a later step failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ legiscan/ render_manifest.csv
          git diff --staged --quiet || \
            git commit -m "chore: automated update $(date -u +%Y-%m-%d)"
          git push
