name: Daily Pipeline Update

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC = midnight CT
  workflow_dispatch:  # full or forced re-renders go through render-backlog.yml

concurrency:
  group: pipeline
  cancel-in-progress: false  # let a running job finish rather than cancel it

permissions:
  contents: write  # the final step pushes docs/, data/ and the manifest back to main

jobs:
  update-and-render:
    # Pinned to 24.04; see .github/actions/setup-site/action.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R, Quarto and renv
        uses: ./.github/actions/setup-site

      - name: Run pipeline
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          # Stop starting new bill pages after this long, so the job finishes
          # (legislators, committees, commit) inside timeout-minutes. Bills not
          # reached stay out of render_manifest.csv and the next run renders them.
          # Measured 2026-10-13: setup + pipeline ~10 min, bills ~8/min, and
          # the always-forced legislators + committees ~115 min. 180 finished
          # 5 seconds inside the 300-minute timeout; 150 leaves ~25 min slack.
          RENDER_TIME_BUDGET_MINUTES: 150
        run: Rscript R/legislature/run_pipeline.R

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 7

      - name: Commit and push updates
        if: always()  # keep partial render progress even if a later step failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ legiscan/ render_manifest.csv
          git diff --staged --quiet || \
            git commit -m "chore: automated update $(date -u +%Y-%m-%d)"
          # Main may have moved during the hours-long render. The bot commits only
          # generated files, so on a conflict keep its freshly rendered version.
          git pull --rebase -X theirs
          git push
