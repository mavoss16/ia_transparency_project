name: Backfill Session Data

# Manual only. Builds an earlier General Assembly's data layer from the raw
# LegiScan JSON already committed in legiscan/ga{N}/ (fetch it first with
# R/legislature/download/download_legiscan_bulk.R): 01c, 02, 02b, the 03
# relationship scrape, and 06. See R/legislature/run_backfill.R. Renders no
# pages; render the session afterwards.
#
# The 03 scrape takes ~2-2.5 h for ~3,500 bills. It saves every 50 bills and
# resumes, so if a run stops early, run it again and it picks up where it
# left off.

on:
  workflow_dispatch:
    inputs:
      ga:
        description: 'General Assembly number, e.g. 90 (not the current one)'
        type: string
        required: true
      steps:
        description: 'Steps to run, space-separated. Blank runs all: generate_csvs process_votes legislator_similarity bill_relationships weekly_activity'
        type: string
        default: ''

# Same group as the daily, lobbying and backlog runs, so they queue instead of
# overlapping and never push to main at once. GitHub keeps only one pending
# run per group: a third run queued behind a running and a pending one
# cancels the pending one.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write  # the final step pushes the session's data back to main

jobs:
  backfill:
    # Pinned to 24.04; see .github/actions/setup-site/action.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 350  # GitHub-hosted runners stop jobs at 360

    steps:
      - name: Check inputs
        shell: bash
        env:
          GA: ${{ inputs.ga }}
          STEPS: ${{ inputs.steps }}
        run: |
          [[ "$GA" =~ ^[0-9]{2,3}$ ]] || { echo "ga must be a number, got '$GA'"; exit 1; }
          [[ "$STEPS" =~ ^[a-z_\ ]*$ ]] || { echo "steps may only hold step names"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R, Quarto and renv
        uses: ./.github/actions/setup-site
        # Normally ~2 min. A runner that can't reach the package mirrors hung
        # here for 2 hours on 2026-11-11; fail fast instead.
        timeout-minutes: 20

      - name: Build session data
        # Below the job timeout, so the commit step still runs and keeps the
        # scrape's progress if this step runs long
        timeout-minutes: 310
        shell: bash
        env:
          # Inputs pass through the environment, not the script text
          GA: ${{ inputs.ga }}
          STEPS: ${{ inputs.steps }}
        run: |
          mkdir -p logs/legislature
          # $STEPS unquoted on purpose: one argument per step name
          Rscript R/legislature/run_backfill.R "$GA" $STEPS \
            2>&1 | tee "logs/legislature/backfill_ga${GA}_$(date -u +%Y-%m-%d_%H%M%S).log"
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs
          path: logs/
          retention-days: 7

      - name: Commit and push progress
        if: always()  # keep partial scrape progress even if the build failed or ran long
        shell: bash
        env:
          GA: ${{ inputs.ga }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/legislature/ga${GA}/" "legiscan/ga${GA}/derived/"
          git diff --staged --quiet || \
            git commit -m "chore: backfill data for GA ${GA} $(date -u +%Y-%m-%d)"
          # Main may have moved during the run (a push by hand; the other
          # pipeline runs can't overlap). The bot commits only generated
          # files, so on a conflict keep its version.
          git pull --rebase -X theirs
          git push
