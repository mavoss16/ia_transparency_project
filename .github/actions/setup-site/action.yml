name: Set up site build
description: R 4.5.1, system libraries, Quarto and the renv library, shared by every workflow that runs the pipeline or renders pages.

# The calling job must check out the repository first (local actions load
# from the checkout) and run on ubuntu-24.04: ubuntu-latest moved to 26.04 on
# 2026-10-27, where PPM has no binary for the locked `later` 1.4.2 and its
# source fails to build against the newer glibc.

runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5.1'
        use-public-rspm: true  # binary packages from Posit PPM — faster installs

    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libglpk-dev \
          libudunits2-dev

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Restore renv cache
      uses: r-lib/actions/setup-renv@v2
