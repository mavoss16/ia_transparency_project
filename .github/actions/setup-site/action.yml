name: Set up site build
description: R 4.5.1, system libraries, Quarto and the renv library, shared by every workflow that runs the pipeline or renders pages.

# The calling job must check out the repository first (local actions load
# from the checkout) and run on ubuntu-24.04: ubuntu-latest moved to 26.04 on
# 2026-10-27, where PPM has no binary for the locked `later` 1.4.2 and its
# source fails to build against the newer glibc.

runs:
  using: composite
  steps:
    # Runners download apt packages from the first mirror in apt-mirrors.txt,
    # a regional one (azure.archive.ubuntu.com, or us-east-2.ec2.archive... on
    # some runners). That mirror sometimes serves ~60 kB/s, and setup hit its
    # 20-minute timeout three times on 2026-11-18/19. apt switches mirrors only
    # when a download stalls, not when it's slow, so put the Ubuntu archive
    # first and keep the regional mirror as the last fallback. Must run before
    # setup-r, which makes the first apt download. Same idea as
    # rstudio/shiny-workflows#73, which only handles the Azure mirror.
    - name: Prefer the Ubuntu archive mirror
      shell: bash
      run: |
        f=/etc/apt/apt-mirrors.txt
        if [[ ! -f "$f" ]]; then
          echo "No $f; leaving apt sources alone."
          exit 0
        fi
        echo "Mirror list before:"; cat "$f"
        regional=$(awk '{print $1}' "$f" | grep -vE '^https?://(archive|security)\.ubuntu\.com/' || true)
        {
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n'
          printf 'https://security.ubuntu.com/ubuntu/\tpriority:2\n'
          n=3
          for m in $regional; do printf '%s\tpriority:%d\n' "$m" "$n"; n=$((n + 1)); done
        } | sudo tee "$f.new" > /dev/null
        sudo mv "$f.new" "$f"
        echo "Mirror list after:"; cat "$f"

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5.1'
        use-public-rspm: true  # binary packages from Posit PPM — faster installs

    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libglpk-dev \
          libudunits2-dev

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Restore renv cache
      uses: r-lib/actions/setup-renv@v2
